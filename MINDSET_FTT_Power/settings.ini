[settings]
name = base
model_start = 2011
model_end = 2030
simulation_start = 2011
simulation_end = 2030
enable_modules = FTT-P
scenarios = S0
mset_coupling = True

; T2TI/C2TI source: 'auto' (default) detects 'collapsed' (MSET 12-tech set) vs 'native'
; (FTT_Standalone's 22-tech/23-cost-component set) from the scenario's own BCET file.
; Set explicitly only to override detection.
ftt_tech_classification = auto

; --- FTT_Standalone configuration ---

; Year / index parameters
prsc_base_year      = 2013
ex_base_year        = 2013
rldc_start_year     = 2018
costc_skip_until = 2016
bcet_copy_range_end = 17
usd_exchange_region = North America
usd_eur_rate        = 1.0018

; LCOE / gamma
gamma_mode          = additive

; Storage
storage_learning_base_year = 2020
storage_currency_factor    = 1.34

; Sector coupling (disable when called from MSET — V2G variables not present)
sector_coupling     = False

; --- MSET interface layer ---

; Pre-call converter: REPPX -> CO2taxP unit conversion factor (EUR2015/tCO2 -> USD2013/MWh scaling)
carbon_price_conv_factor = 1.3281