[settings]
; FTT:Transport as its own FTT run at native 71 regions, coupled to MSET at IPCC-10 through
; SourceCode/ftt_transport.py + MINDSET_FTT_Power/SourceCode/support/ftt_region_map.py. Selected by ftt_tr_run = True in
; the MSET .ini. Data: copy Inputs/S0/{FTT-Tr,General} and Utilities/titles/{classification_titles,VariableListing}.csv from FTT_StandAlone into FTT-Tr-Inputs/.
name = transport_ftt_tr
model_start = 2011
model_end = 2030
simulation_start = 2011
simulation_end = 2030
enable_modules = FTT-Tr
scenarios = S0
mset_coupling = True

; This run's own Inputs/ and Utilities/titles/ (native 71-region classification),
; independent of the 10-region Power inputs in MINDSET_FTT_Power/Inputs.
data_root = MINDSET_FTT_Power/FTT-Tr-Inputs

; MSET's ctax is USD/tCO2 (scenario sheet "Carbon tax (USD / tCO2)"; emission cost = z_bp [kUSD] x
; EF [ktCO2/kUSD] x ctax), so CO2taxTr takes it as is. (Power's CO2taxP applies 1.3281 because its
; code assumes EUR2015; that assumption looks wrong for the same reason but is not touched here.)
; Currency-year differences (MSET USD 2019 vs FTT 2013/2023 USD) are not adjusted.
carbon_price_conv_factor = 1.0
